# Full stack for a single VPS: postgres + api + Next.js + nginx.
# Run from finance-track-back with finance-track-front as a sibling directory:
#   ../finance-track-front
#
#   cp .env.example .env   # set PUBLIC_ORIGIN, secrets, mail
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:17
    container_name: finance-track-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: builder
    container_name: finance-track-migrate
    restart: 'no'
    command: ['pnpm', 'prisma', 'migrate', 'deploy']
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: finance-track-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_WEBROOT: /mailpit
    expose:
      - '1025'
      - '8025'

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: finance-track-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: ${PUBLIC_ORIGIN}
      APP_URL: ${PUBLIC_ORIGIN}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURE: ${MAIL_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  web:
    build:
      context: ../finance-track-front
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BFF: ${PUBLIC_ORIGIN}/api
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    container_name: finance-track-web
    restart: unless-stopped
    environment:
      NEXT_API_BACKEND: http://api:3000
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: finance-track-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_etc:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      mailpit:
        condition: service_started

  certbot:
    image: certbot/certbot:v3.2.0
    container_name: finance-track-certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'

volumes:
  postgres_data:
  certbot_etc:
  certbot_www:
