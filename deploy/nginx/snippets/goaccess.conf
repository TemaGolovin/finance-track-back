# Docker DNS at request time, so nginx can start before the goaccess container.
resolver 127.0.0.11 valid=10s ipv6=off;

location = /goaccess {
  return 301 /goaccess/;
}

location = /goaccess/ {
  access_log off;
  auth_basic "Analytics";
  auth_basic_user_file /etc/nginx/goaccess/htpasswd;
  root /var/www/goaccess;
  try_files /index.html =404;
  default_type text/html;
  add_header Cache-Control "no-store";
}

location /goaccess/ws {
  access_log off;
  auth_basic "Analytics";
  auth_basic_user_file /etc/nginx/goaccess/htpasswd;
  set $goaccess_upstream goaccess:7890;
  proxy_pass http://$goaccess_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1d;
  proxy_send_timeout 1d;
  proxy_buffering off;
}
